name: CI

on:
  pull_request:
  push:
    branches:
      - feat-cartman-bridge
      - startup-readiness

jobs:
  hardhat:
    name: Hardhat compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test
